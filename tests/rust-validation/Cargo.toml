[package]
name = "envelope-validation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bc-envelope = "=0.43.0"
bc-components = "0.31"
bc-rand = "=0.5.0"
bc-ur = "0.19"
dcbor = { version = "0.25", features = ["num-bigint"] }
known-values = "0.15"
sskr = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"
